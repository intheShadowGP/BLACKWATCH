# Refreshes the intelligence datasets, verifies, builds and publishes the
# application to GitHub Pages. Runs on every push to main and once a day, so
# the published datasets stay current even without code changes.
# Repository settings -> Pages -> Source must be set to "GitHub Actions".
name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  schedule:
    # 05:17 UTC daily (off the hour to avoid the scheduler's peak).
    - cron: '17 5 * * *'
  workflow_dispatch:

# Default for every job: read-only. The deploy job widens it to what Pages needs.
permissions:
  contents: read

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      # Retrieves, validates and normalises the public datasets into public/data.
      # A source that fails keeps the last valid copy from the deployed site
      # (marked "stale"); a source with no valid copy is marked "missing".
      - name: Build datasets
        # The fallback URL is the deployed project site, built from variables
        # that are set for every trigger, scheduled runs included.
        run: |
          export DATA_FALLBACK_URL="https://${GITHUB_REPOSITORY_OWNER,,}.github.io/${GITHUB_REPOSITORY#*/}/"
          npm run data:build
        env:
          # Optional repository secret; the pipeline respects the public rate limit without it.
          NVD_API_KEY: ${{ secrets.NVD_API_KEY }}
      # lint -> typecheck -> unit tests -> build -> identity check; any failure stops the deployment.
      - run: npm run verify
      - run: npm run audit:deps
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
